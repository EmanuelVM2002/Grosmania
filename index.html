<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0fb5a3">
<link rel="icon" href="favicon.ico?v=2" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<title>Gro’smania · Heladería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#0fb5a3;--rose:#ff5fa2;--mint:#7fd85e;--violet:#35b6ee;--orange:#ffb454;--bg:#f2fbfa;--ink:#16302f;--muted:#5d7a7c;--line:#d9f0ee;--shadow:0 10px 30px rgba(15,181,163,.15);--r:22px;--hh:62px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.45}
h1,h2,h3,.brand{font-family:Fredoka,Inter,sans-serif;letter-spacing:.2px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;font-size:16px} /* 16px evita el zoom automático de iOS */
[hidden]{display:none!important}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;transition:.2s;white-space:nowrap;min-height:44px}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;box-shadow:0 8px 20px rgba(15,181,163,.3)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:#ffe6e6;color:#d6285c}
.btn-wa{background:#25d366;color:#fff;box-shadow:0 8px 20px rgba(37,211,102,.3)}
.btn-sm{padding:8px 14px;font-size:.85rem;min-height:38px}
.btn.block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);position:relative;font-size:1.1rem}
.badge{position:absolute;top:-4px;right:-4px;background:var(--rose);color:#fff;font-size:.7rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}

/* ---------- Encabezado ---------- */
.top{position:sticky;top:0;z-index:50;height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(4vw,14px);background:rgba(242,251,250,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:1.45rem;font-weight:700;color:var(--pink)}
.logo-img{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 3px 10px rgba(15,181,163,.25)}
.links{display:flex;gap:24px;font-weight:600}
.links a{color:var(--muted);text-decoration:none}.links a:hover{color:var(--pink)}
.acts{display:flex;gap:8px;align-items:center}

/* ---------- Portada ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:center;padding:34px max(5vw,16px) 40px;max-width:1150px;margin:auto}
.pill{display:inline-block;background:#fff;border:1.5px solid var(--line);padding:6px 14px;border-radius:999px;font-weight:600;font-size:.84rem;color:var(--pink);margin-bottom:14px}
.hero h1{font-size:clamp(2.3rem,7vw,4.4rem);line-height:1.03}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:14px 0 22px;font-size:1.05rem;color:var(--muted);max-width:480px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.stage{position:relative;display:grid;place-items:center;min-height:300px}
.stage .disc{width:min(300px,72vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#c9f4ee 60%,#a4e8de);display:grid;place-items:center;box-shadow:0 24px 60px rgba(15,181,163,.3);animation:float 5s ease-in-out infinite}
.stage .disc img{width:62%}
.spr{position:absolute;font-size:2.3rem;animation:float 5s ease-in-out infinite}
.spr.a{top:6%;left:6%}.spr.b{top:12%;right:4%;animation-delay:-2s}.spr.c{bottom:8%;left:2%;animation-delay:-3s}.spr.d{bottom:4%;right:8%;animation-delay:-1s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}

/* ---------- Carta corrida ---------- */
section{padding:44px max(4vw,14px)}
section[id]{scroll-margin-top:calc(var(--hh) + 6px)}
.sec-head{text-align:center;margin-bottom:20px}
.sec-head h2{font-size:clamp(1.9rem,5vw,2.8rem)}
.sec-head p{color:var(--muted);margin-top:6px}
.carta{padding-top:24px}
.tools{max-width:860px;margin:0 auto 12px;display:flex;gap:8px}
.tools .search{flex:1;position:relative}
.tools input{width:100%;padding:12px 16px 12px 42px;border-radius:999px;border:1.5px solid var(--line);background:#fff;outline:0;min-height:46px}
.tools input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(15,181,163,.12)}
.tools .search::before{content:"🔍";position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:.95rem}
.tools .btn{padding:0 16px}
.tools .on{background:var(--rose);color:#fff;border-color:var(--rose)}
.chipbar{position:sticky;top:var(--hh);z-index:40;background:linear-gradient(var(--bg) 82%,transparent);padding:8px max(4vw,14px) 10px;margin:0 calc(-1 * max(4vw,14px));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.chipbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:.92rem;white-space:nowrap;min-height:40px;transition:.2s}
.chip.active{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border-color:transparent;transform:scale(1.04)}
.menu{position:relative;max-width:860px;margin:6px auto 0;background:#fff;border-radius:28px;padding:10px 22px 24px;box-shadow:var(--shadow);overflow:hidden}
.menu::before{content:"";position:absolute;inset:0;background:url(logo-gm.png?v=2) center top/340px auto repeat-y;opacity:.045;pointer-events:none}
.menu>*{position:relative}
.cat{scroll-margin-top:calc(var(--hh) + 62px);padding-top:18px}
.cat h2{font-size:1.5rem;display:flex;align-items:center;gap:10px;color:var(--pink);padding-bottom:6px;border-bottom:3px solid var(--line);margin-bottom:2px}
.cat h2 small{font-family:Inter;font-size:.78rem;color:var(--muted);font-weight:600;margin-left:auto}
.it{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:14px 6px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:14px;transition:background .15s}
.it:active{background:#e9faf7}
.it .nm{font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.it .pr{font-family:Fredoka;font-weight:600;color:var(--pink);font-size:1.15rem;text-align:right;white-space:nowrap}
.it .ds{color:var(--muted);font-size:.88rem;line-height:1.4}
.it .ad{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-size:1.5rem;font-weight:600;display:grid;place-items:center;position:relative;box-shadow:0 6px 14px rgba(15,181,163,.3);transition:transform .15s}
.it .ad:active{transform:scale(.9)}
.it .ad.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.it .inq{position:absolute;top:-6px;right:-6px;background:var(--rose);color:#fff;font-size:.72rem;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.it .inq:empty{display:none}
.tagp{background:#e6fbf8;color:var(--pink);border-radius:999px;font-size:.68rem;font-weight:700;padding:2px 9px}
.heart{font-size:1.05rem;line-height:1;padding:4px;filter:grayscale(1);opacity:.45}
.heart.on{filter:none;opacity:1}
.it.hl{animation:hl 1.6s}
@keyframes hl{0%,60%{background:#fff3b0}100%{background:transparent}}
.addbox{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px}
.addbox span{background:#f2fbfa;border:1.5px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600}
.addbox em{font-style:normal;color:var(--pink);margin-left:6px}
.nores{text-align:center;color:var(--muted);padding:30px 10px}

/* ---------- Carrito / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,48,47,.45);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:#fff;z-index:100;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.15)}
.drawer.show{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:14px 20px}
.drawer footer{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cart-item .info{flex:1;min-width:0}.cart-item small{color:var(--muted)}
.cart-item small.det{display:block;margin-top:2px;line-height:1.3}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:1.1rem}
.sum-row{display:flex;justify-content:space-between;margin:6px 0;gap:10px}
.sum-row.total{font-family:Fredoka;font-size:1.4rem;font-weight:600;margin-top:10px}
.hint{font-size:.85rem}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:110;pointer-events:none;padding:16px}
.modal>div{background:#fff;border-radius:26px;padding:24px;width:min(520px,100%);max-height:92vh;overflow:auto;transform:scale(.94);opacity:0;transition:.25s;pointer-events:none}
.modal.show>div{transform:none;opacity:1;pointer-events:auto}
.modal h3{font-size:1.4rem;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.opt-g select{padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0;width:100%;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(15,181,163,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-g{margin-bottom:14px}.opt-g>b{display:block;font-size:.92rem;margin-bottom:6px}.opt-g select{margin-bottom:6px}
.addons{display:grid;gap:6px;max-height:230px;overflow:auto}
.addons label{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:.9rem;min-height:44px;align-items:center}
.addons label:has(input:checked){border-color:var(--pink);background:#e6fbf8}
.cbox{background:#f2fbfa;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:.9rem;display:grid;gap:8px}
.cbox select{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;width:100%;min-height:44px}
.toast-wrap{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .3s;text-align:center}
@keyframes pop{from{transform:translateY(20px);opacity:0}}

.quiz-cta{display:flex;align-items:center;gap:14px;width:100%;max-width:860px;margin:0 auto 14px;padding:14px 18px;border-radius:22px;background:linear-gradient(135deg,#fff3f9,#fffbe6 55%,#e6fbf8);border:2px dashed var(--rose);text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.quiz-cta:active{transform:scale(.98)}
.quiz-cta .q-e{font-size:2.2rem;animation:float 3s ease-in-out infinite}
.quiz-cta .q-t{flex:1;display:grid}
.quiz-cta b{font-family:Fredoka;font-size:1.2rem}
.quiz-cta small{color:var(--muted);font-size:.86rem}
.quiz-cta .q-go{background:var(--rose);color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;font-size:.88rem;white-space:nowrap}
.quiz{position:fixed;inset:0;z-index:150;background:linear-gradient(160deg,#e6fbf8,#fff3f9 55%,#fffbe6);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
.quiz::before{content:"";position:fixed;inset:0;background:url(logo-gm.png?v=2) center/min(80vw,420px) no-repeat;opacity:.06;pointer-events:none}
.q-top{width:100%;max-width:560px;display:flex;justify-content:flex-end;position:relative}
.q-card{position:relative;width:100%;max-width:560px;margin:auto;background:#fff;border-radius:28px;padding:26px 22px;box-shadow:var(--shadow);text-align:center}
.q-in{animation:qin .35s ease}
@keyframes qin{from{opacity:0;transform:translateY(18px) scale(.97)}}
.q-big{font-size:3.4rem;line-height:1;margin-bottom:8px}
.q-card h2{font-size:clamp(1.4rem,5vw,1.8rem);line-height:1.2;margin-bottom:8px}
.q-sub{color:var(--muted);margin-bottom:16px}
.q-prog{height:10px;background:#e6f6f4;border-radius:99px;overflow:hidden;margin-bottom:8px}
.q-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--rose));border-radius:99px;transition:width .4s}
.q-count{display:block;color:var(--muted);font-weight:600;margin-bottom:10px}
.q-opts{display:grid;gap:10px;margin-top:14px}
.q-opt{padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:1.02rem;min-height:54px;text-align:center;transition:.15s;display:grid;gap:2px;justify-items:center}
.q-opt small{color:var(--muted);font-weight:500;font-size:.8rem}
.q-opt:active,.q-opt:hover{border-color:var(--pink);background:#e6fbf8;transform:scale(1.02)}
.q-res h4{margin:16px 0 8px;font-family:Fredoka;font-size:1.1rem}
.q-bars{display:grid;gap:7px;margin-bottom:16px;text-align:left}
.q-bars div{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px;font-size:.85rem;font-weight:600}
.q-bars i{height:10px;background:#e6f6f4;border-radius:99px;overflow:hidden;display:block}
.q-bars b{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet));border-radius:99px;animation:grow .8s ease}
@keyframes grow{from{width:0!important}}
.q-win{background:linear-gradient(135deg,#e6fbf8,#fff3f9);border:2px solid var(--pink);border-radius:22px;padding:18px 16px}
.q-win h3{font-size:1.6rem;margin:4px 0}
.q-pct{display:inline-block;background:var(--rose);color:#fff;font-weight:700;border-radius:999px;padding:3px 12px;font-size:.82rem;margin-bottom:8px}
.q-win p{color:var(--muted);font-size:.92rem;margin-bottom:8px}
.q-why{color:var(--ink)!important;font-weight:600}
.q-price{font-family:Fredoka;font-size:1.8rem;font-weight:700;color:var(--pink);margin:6px 0 10px}
.q-alt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:8px}
.q-end{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:28px}
.conf span{position:absolute;top:-30px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
@media(max-width:820px){.q-bars div{grid-template-columns:110px 1fr}}
.ubi{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;max-width:1100px;margin:auto;align-items:stretch}
.ubi-card{background:#fff;border-radius:26px;padding:24px;box-shadow:var(--shadow)}
.ubi-card h3{font-size:1.15rem;margin-bottom:6px}
.ubi-dir{font-size:1.02rem;font-weight:600;margin-bottom:12px}
.ubi-btns{display:flex;gap:8px;flex-wrap:wrap}
.ubi-st{margin-bottom:12px}
.ubi-badge{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.ubi-badge.on{background:#dff7e6;color:#17803d}.ubi-badge.off{background:#ffe6ec;color:#c2325a}
.ubi-h{width:100%;border-collapse:collapse;font-size:.95rem}
.ubi-h td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.ubi-h td:last-child{text-align:right;font-weight:600}
.ubi-h tr.hoy td{color:var(--pink);font-weight:700}
.ubi-map{border-radius:26px;overflow:hidden;box-shadow:var(--shadow);min-height:380px;background:#e6f6f4}
.ubi-map iframe{width:100%;height:100%;min-height:380px;border:0;display:block}
.wa{background:linear-gradient(135deg,#e7fbef,#f2fbfa);max-width:1100px;margin:auto;border-radius:30px;display:grid;grid-template-columns:1fr 1.1fr;gap:26px;align-items:center}
.wa h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:8px}
.wa .lead{color:var(--muted);margin-bottom:12px}
.wa ul{list-style:none;display:grid;gap:8px;font-weight:500}
.wa .form{background:#fff;border-radius:26px;padding:22px;box-shadow:var(--shadow)}
.wa textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);outline:0;min-height:90px;resize:vertical}
/* ---------- Club ---------- */
.club{background:linear-gradient(135deg,#e6fbf8,#fff3f9 60%,#fffbe6)}
.club-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:start;max-width:1100px;margin:auto}
.mcard{background:#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow)}
.mcard h3{font-size:1.25rem;margin-bottom:10px}
.mcard form{display:grid;gap:10px;margin-bottom:14px}
.mcard input{padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);width:100%;min-height:46px}
.sep{color:var(--muted);text-align:center;font-size:.85rem;margin:6px 0}
.pts{font-family:Fredoka;font-size:3.2rem;font-weight:700;line-height:1;color:var(--pink)}
.tierpill{display:inline-block;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;font-size:.85rem}
.bar{height:12px;border-radius:99px;background:#e6f6f4;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--mint));border-radius:99px}
.hist{margin-top:12px;font-size:.88rem;color:var(--muted);display:grid;gap:5px}.hist div{display:flex;justify-content:space-between;gap:10px}
.club-info{display:grid;gap:18px}.club-info h3{font-size:1.15rem;margin-bottom:6px}
.rw{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rw>div,.tiers>div{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.rw b{font-family:Fredoka;font-size:1.45rem;color:var(--pink);display:block}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tiers b{display:block}
.club-info ul,.guide ul{list-style:none;display:grid;gap:7px}
.gift{background:#fff7d6;border:1.5px dashed #e8c44a;border-radius:14px;padding:10px 12px;margin-top:10px;font-weight:600;font-size:.92rem}

footer.foot{padding:28px max(4vw,14px) 40px;text-align:center;color:var(--muted);font-size:.9rem}
footer.foot a{color:var(--pink);font-weight:600;cursor:pointer}

/* ---------- Barra inferior (celular) ---------- */
.tabbar{display:none}
@media(max-width:820px){
  :root{--hh:56px}
  .links{display:none}
  .hero{grid-template-columns:1fr;padding-top:22px;text-align:left}
  .stage{min-height:230px;order:-1}
  .stage .disc{width:min(210px,56vw)}
  .club-grid,.wa,.ubi{grid-template-columns:1fr}
  .ubi-map,.ubi-map iframe{min-height:320px}
  .tiers{grid-template-columns:1fr}
  .menu{padding:6px 14px 20px;border-radius:22px}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}

/* =========================================================
   CLUB GRO’SMANIA
   ========================================================= */
function digits(v){return String(v||'').replace(/\D/g,'')}
function findMember(db,ph){return db.members.find(m=>m.phone===digits(ph))}
function tierOf(db,m){
  const visits=db.orders.filter(o=>o.phone===m.phone&&o.status==='Entregado'&&Date.now()-new Date(o.date)<90*864e5).length;
  let t=TIERS[0];TIERS.forEach(x=>{if(visits>=x.min)t=x});
  return {t,visits,next:TIERS[TIERS.indexOf(t)+1]};
}
function newMember(db,name,phone,birthday,ref){
  const m={phone:digits(phone),name,birthday:birthday||'',points:0,lifetime:0,joined:new Date().toISOString(),ref:ref&&ref!==digits(phone)&&findMember(db,ref)?digits(ref):'',refPaid:false,bdayYear:0,ledger:[]};
  db.members.push(m);return m;
}
function addLedger(m,pts,desc){m.ledger.unshift({d:new Date().toISOString(),pts,desc});if(m.ledger.length>40)m.ledger.length=40}
function awardPoints(db,o){
  const m=findMember(db,o.phone); if(!m||o.pointsAwarded)return;
  const base=o.base??o.total, mult=tierOf(db,m).t.mult;
  const pts=Math.floor(base/1000*mult); if(pts<=0)return;
  m.points+=pts;m.lifetime+=pts;o.pointsAwarded=pts;addLedger(m,pts,'Compra #'+o.id+(mult>1?' (x'+mult+')':''));
  if(m.ref&&!m.refPaid&&base>=10000){
    const r=findMember(db,m.ref);
    if(r){r.points+=REF_BONUS;r.lifetime+=REF_BONUS;addLedger(r,REF_BONUS,'Tu amigo/a '+m.name.split(' ')[0]+' hizo su primera compra');
      m.points+=REF_BONUS;m.lifetime+=REF_BONUS;addLedger(m,REF_BONUS,'Bono por venir de parte de un amigo/a')}
    m.refPaid=true;
  }
}
function revokePoints(db,o){
  const m=findMember(db,o.phone); if(!m||!o.pointsAwarded)return;
  m.points-=o.pointsAwarded;m.lifetime-=o.pointsAwarded;addLedger(m,-o.pointsAwarded,'Compra #'+o.id+' ya no cuenta');o.pointsAwarded=0;
}
function clubOnStatus(o,s){
  const m=findMember(DB,o.phone), was=o.status;
  if(was==='Entregado'&&s!=='Entregado')revokePoints(DB,o);
  if(m&&o.rew&&o.rew.pts>0){
    if(s==='Cancelado'&&was!=='Cancelado'){m.points+=o.rew.pts;addLedger(m,o.rew.pts,'Puntos devueltos: pedido #'+o.id+' cancelado');o.rewRefunded=true}
    else if(was==='Cancelado'&&s!=='Cancelado'&&o.rewRefunded){m.points-=o.rew.pts;addLedger(m,-o.rew.pts,'Canje del pedido #'+o.id+' reactivado');o.rewRefunded=false}
  }
  if(s==='Entregado'&&was!=='Entregado')awardPoints(DB,o);
}
function bdayEligible(m){
  if(!m.birthday)return false;
  const y=new Date().getFullYear(); if(m.bdayYear===y)return false;
  const [mm,dd]=m.birthday.split('-').map(Number), d=new Date(y,mm-1,dd);
  return Math.abs(Date.now()-d)<=3.5*864e5;
}
function rewardsFor(m,base){
  const list=REWARDS.filter(r=>m.points>=r.pts&&base>=r.value);
  if(bdayEligible(m)&&base>=BDAY.value)list.unshift(BDAY);
  return list;
}
const rewardById=id=>id==='bday'?BDAY:REWARDS.find(r=>r.id===id);
/* Aplica el canje de un premio: descuenta puntos o marca el regalo de cumpleaños */
function spendReward(m,r,orderId){
  if(r.pts>0){m.points-=r.pts;addLedger(m,-r.pts,'Canje: '+r.label+' (#'+orderId+')')}
  else{m.bdayYear=new Date().getFullYear();addLedger(m,0,'Regalo de cumpleaños (#'+orderId+')')}
}
function seedClub(db){
  MEMBERS_DEMO.forEach(([n,p,b])=>newMember(db,n,p,b));
  db.orders.filter(o=>o.phone&&o.status==='Entregado').sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(o=>awardPoints(db,o));
}

function initCarta(){
  if(spy)spy.disconnect();
  spy=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setActiveChip(e.target.dataset.c)})},{rootMargin:'-120px 0px -65% 0px'});
  document.querySelectorAll('.cat').forEach(c=>spy.observe(c));
  setActiveChip('copas');
  if(favOnly)$('#favbtn')?.classList.add('on');
}
function setActiveChip(c){
  const bar=$('#chips'); if(!bar)return;
  bar.querySelectorAll('.chip').forEach(b=>{const on=b.dataset.c===c;b.classList.toggle('active',on);if(on){const l=b.offsetLeft-bar.clientWidth/2+b.clientWidth/2;bar.scrollTo({left:l,behavior:'smooth'})}});
}
function goCat(c){
  const el=document.getElementById('cat-'+c); if(!el)return;
  if($('#q')&&$('#q').value){$('#q').value='';filterMenu()}
  const y=el.getBoundingClientRect().top+window.scrollY-(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hh'))+58);
  window.scrollTo({top:y,behavior:'smooth'});
}
function filterMenu(){
  const q=norm($('#q').value.trim());let any=false;
  document.querySelectorAll('.cat').forEach(sec=>{
    if(sec.dataset.c==='adiciones'){sec.hidden=!!q||favOnly;return}
    let n=0;sec.querySelectorAll('.it').forEach(el=>{const ok=(!q||el.dataset.t.includes(q))&&(!favOnly||favs.has(+el.dataset.id));el.hidden=!ok;if(ok)n++});
    sec.hidden=!n;any=any||n>0;
  });
  $('#nores').hidden=any;
}
function toggleFav(id,btn){
  favs.has(id)?favs.delete(id):favs.add(id);btn.classList.toggle('on',favs.has(id));
  try{localStorage.setItem('gm.favs',JSON.stringify([...favs]))}catch(e){}
  toast(favs.has(id)?'❤️ Guardado en tus favoritos':'Quitado de favoritos');if(favOnly)filterMenu();
}
function toggleFavOnly(){
  favOnly=!favOnly;$('#favbtn').classList.toggle('on',favOnly);
  if(favOnly&&!favs.size)toast('Aún no tienes favoritos: toca el ❤️ de un producto');

}
function surprise(){

const needsCustom=p=>(p.opts&&p.opts.length)||p.adds||(p.addons&&p.addons.length);
const addonsOf=p=>[...(p.adds?ADICIONES:[]),...(p.addons||[])];
const listOf=g=>g.list==='flavors'?FLAVORS:g.list;
const qtyOf=id=>cart.filter(l=>l.id===id).reduce((a,l)=>a+l.qty,0);
function lineDetail(l){
  const parts=(l.sel||[]).map(x=>x.label.replace(/ \(\d\)$/,'')+': '+x.v.join(', '));
  if(l.adds&&l.adds.length)parts.push('Adiciones: '+l.adds.join(', '));
  if(l.note)parts.push('Nota: '+l.note);
  return parts.join(' · ');
}
function updateCartUI(bumpId){
  document.querySelectorAll('[data-cartcount]').forEach(e=>e.textContent=cartCount()||'');

  if(bumpId){const b=document.getElementById('ad'+bumpId);if(b){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}}
}
function pushLine(p,sel,adds,note){
  const extra=addonsOf(p).filter(a=>adds.includes(a[0])).reduce((x,a)=>x+a[1],0);
  const key=JSON.stringify([p.id,sel,adds,note]);
  const it=cart.find(l=>l.key===key);
  if(it)it.qty++;else cart.push({key,id:p.id,qty:1,sel,adds,note,unit:p.price+extra});
  toast(p.emoji+' '+p.name+' agregado'); updateCartUI(p.id);
}
function tapItem(id){const p=prod(id);needsCustom(p)?openCustom(id):pushLine(p,[],[],'')}

function confirmCustom(id){

function chQty(i,d){
  const l=cart[i]; if(!l)return;
  l.qty+=d; if(l.qty<=0)cart.splice(i,1);
  updateCartUI(); openCart();
}
function comboCalc(){
  const q=f=>cart.reduce((a,l)=>a+(f(prod(l.id))?l.qty:0),0);
  const copas=q(p=>p.cat==='Copas'), wm=q(p=>p.name==='Waffle Medio'), ja=q(p=>p.name==='Jugo Natural en Agua');
  const combos=[],hints=[];
  if(copas>=2)combos.push({label:'Dúo de copas ×'+Math.floor(copas/2),disc:Math.floor(copas/2)*COMBO_COPAS});
  if(copas%2===1)hints.push('Agrega otra copa y ahorra '+money(COMBO_COPAS));
  if(Math.min(wm,ja)>0)combos.push({label:'Waffle medio + jugo ×'+Math.min(wm,ja),disc:Math.min(wm,ja)*COMBO_WAFFLE});
  if(wm>ja)hints.push('Agrega un jugo natural en agua a tu waffle medio y ahorra '+money(COMBO_WAFFLE));
  return {combos,hints,comboD:combos.reduce((a,c)=>a+c.disc,0)};
}
function totals(rid){
  if(rid===undefined)rid=redeem;
  const sub=cart.reduce((a,l)=>a+l.unit*l.qty,0), {combos,hints,comboD}=comboCalc();
  const pre=Math.max(0,sub-comboD), r=rid?rewardById(rid):null;
  const rew=r?Math.min(r.value,pre):0, base=pre-rew, ship=sub>0?DELIVERY:0;
  return {sub,combos,hints,comboD,rew,base,ship,total:base+ship};
}
const DELIVERY=3000;

const UBI={dir:'Cra. 16 #55-09, San Antonio, Villa Hermosa, Medellín, Antioquia',link:'https://maps.app.goo.gl/HiStr8iVhE7rX5xX8'};
const HORARIO=[[750,1230],[810,1230],[810,1230],[810,1230],[810,1230],[810,1230],[810,1230]];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const mapsDir=()=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(UBI.dir);

const hhmm=m=>{const h=Math.floor(m/60),mm=m%60,p=h>=12?'p. m.':'a. m.',h12=h%12||12;return h12+':'+String(mm).padStart(2,'0')+' '+p};
function nowCO(){ // hora de Colombia, sin importar dónde esté el visitante
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Bogota',weekday:'short',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;
  return {d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),m:(+g('hour')%24)*60+ +g('minute')};
}
function openState(){
  const n=nowCO(), [a,c]=HORARIO[n.d];
  if(n.m>=a&&n.m<c)return {open:true,txt:'Abierto ahora · cerramos a las '+hhmm(c)};
  if(n.m<a)return {open:false,txt:'Cerrado · hoy abrimos a las '+hhmm(a)};
  const nx=(n.d+1)%7;return {open:false,txt:'Cerrado · mañana abrimos a las '+hhmm(HORARIO[nx][0])};
}
const openPill=()=>{const s=openState();return (s.open?'🟢 ':'🔴 ')+s.txt};
const openBadge=()=>{const s=openState();return `<span class="ubi-badge ${s.open?'on':'off'}">${s.open?'🟢':'🔴'} ${s.txt}</span>`};

}

const WHATSAPP='573017759082';
function waMessage(name,extra){
  const t=totals(null), L=['Hola Gro’smania 👋, quiero hacer un pedido:'];
  if(name)L.push('Mi nombre: '+name);
  if(cart.length){
    L.push('');
    cart.forEach(l=>{const d=lineDetail(l);L.push('• '+l.qty+'× '+prod(l.id).name+(d?' ('+d+')':'')+' — '+money(l.unit*l.qty))});
    t.combos.forEach(c=>L.push('🎁 '+c.label+': −'+money(c.disc)));
    L.push('Total de productos: '+money(t.sub-t.comboD));
  }
  if(extra){L.push('');L.push(extra)}
  if(!cart.length&&!extra)L.push('','Quisiera pedir… (cuéntanos qué se te antoja)');
  if(clubPhone)L.push('','Mi celular del Club: '+clubPhone);
  return L.join('\n');
}
const waUrl=text=>'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(text);
function waOrderMessage(o,t){
  const L=['Hola Gro’smania 👋, quiero hacer este pedido:','','*Pedido #'+o.id+'*','Nombre: '+o.customer,'Modalidad: '+o.method];
  if(o.address)L.push('Dirección: '+o.address);
  L.push('');
  cart.forEach(l=>{const d=lineDetail(l);L.push('• '+l.qty+'× '+prod(l.id).name+(d?' ('+d+')':'')+' — '+money(l.unit*l.qty))});
  t.combos.forEach(c=>L.push('🎁 '+c.label+': −'+money(c.disc)));
  if(o.rew)L.push('💚 Premio del Club: −'+money(o.rew.value));
  if(t.ship)L.push('Domicilio: '+money(t.ship));
  L.push('*Total a pagar: '+money(t.total)+'*');
  if(o.phone)L.push('','Mi celular: '+o.phone);
  return L.join('\n');
}

function coLookup(){
  const box=$('#co_club'); if(!box)return;
  const ph=digits($('#co_t').value), m=findMember(DB,ph), pre=totals(null).base;
  if(!m&&redeem)redeem=null;
  if(m){
    const opts=rewardsFor(m,pre);
    if(redeem&&!opts.some(r=>r.id===redeem))redeem=null;
    box.innerHTML=`<div class="cbox"><span>💚 Hola, <b>${esc(m.name.split(' ')[0])}</b>: tienes <b>${m.points}</b> puntos y ganarás ~<b>${Math.floor(pre/1000*tierOf(DB,m).t.mult)}</b> con este pedido.</span>
    ${opts.length?`<select id="co_rw" onchange="redeem=this.value||null;coTotal()"><option value="">No canjear premio ahora</option>${opts.map(r=>`<option value="${r.id}" ${redeem===r.id?'selected':''}>${r.label} · −${money(Math.min(r.value,pre))}${r.pts?' ('+r.pts+' pts)':' (gratis)'}</option>`).join('')}</select>`:`<small style="color:var(--muted)">Aún no alcanzas un premio (el primero son ${REWARDS[0].pts} puntos y un pedido de al menos ${money(REWARDS[0].value)}).</small>`}</div>`;
  }else if(ph.length>=10){
    box.innerHTML=`<label class="cbox" style="grid-template-columns:auto 1fr;align-items:center"><input type="checkbox" id="co_join" checked> <span>Unirme gratis al <b>Club Gro’smania</b> y ganar puntos con este pedido</span></label>`;
  }else box.innerHTML='';
  coTotal();
}
function coMode(){const d=$('#co_m').value==='Domicilio';$('#co_addr_f').hidden=!d;const e=$('#co_total');if(e)e.textContent=money(totals().total-(d?0:DELIVERY))}
function coTotal(){const e=$('#co_total');if(e)e.textContent=money(totals().total-($('#co_m').value==='Local'?DELIVERY:0))}
function placeOrder(){
  const name=$('#co_name').value.trim(); if(!name){toast('Escribe tu nombre');return}
  const mode=$('#co_m').value, address=$('#co_addr').value.trim();
  if(mode==='Domicilio'&&!address){toast('Escribe la dirección de entrega');return}
  const phone=digits($('#co_t').value);
  let m=phone?findMember(DB,phone):null;
  if(!m&&phone.length>=10&&$('#co_join')&&$('#co_join').checked)m=newMember(DB,name,phone,'','');
  if(redeem){const r=rewardById(redeem);if(!(m&&r&&(r.pts===0?bdayEligible(m):m.points>=r.pts)&&totals(null).base>=r.value))redeem=null}
  const t=totals(), r=redeem?rewardById(redeem):null;
  if(mode==='Local'){t.ship=0;t.total=t.base}
  const id=Math.max(...DB.orders.map(o=>o.id),999)+1;
  const o={id,customer:name,phone:m?m.phone:phone,items:cart.map(l=>({id:l.id,qty:l.qty,price:l.unit,sel:l.sel,adds:l.adds,note:l.note})),total:t.total,base:t.base,ship:t.ship,combo:t.comboD,rew:r?{id:r.id,pts:r.pts,value:t.rew}:null,status:'Pendiente',date:new Date().toISOString(),method:mode,address:mode==='Domicilio'?address:'',src:'online'};
  DB.orders.push(o);
  if(r&&m)spendReward(m,r,id);
  if(m)setClubPhone(m.phone);
  const url=waUrl(waOrderMessage(o,t));
  cart=[];redeem=null;save();closeAll();render(true);
  window.open(url,'_blank','noopener')||(location.href=url);
  toast('Pedido #'+id+' listo 🍨 Toca «Enviar» en WhatsApp para confirmarlo.'+(m?' Sumas puntos cuando te lo entreguemos.':''));
}

const KW={ch:['chocolate','brownie','chocoramo','milo','oreo','chokis','chips','chocmelos','fondue'],
 fr:['fresa','mango','maracuy','pina','durazno','mora','cereza','breva','fruta','banano','manzana','papaya','mandarina','guanabana','naranja'],

const CATV={'Copas':{cm:1,cl:1},'Nuevas creaciones':{av:1,in:1},'Ensaladas':{fs:2,fr:2,cl:1},'Malteadas':{bb:3,cm:2},'Waffles':{cj:2,av:1,cn:1},'Minidonas':{cj:1,cp:2,av:1,cn:1},'Obleas':{cj:2,cl:1,cm:1},'Chocolate':{ch:3,cn:2,in:1},'Conos y vasos':{cl:2,kd:1},'Infantiles':{kd:3,av:1},'Bebidas':{bb:3,fs:1}};
const _pv=new Map();
function prodVec(p){
  if(_pv.has(p.id))return _pv.get(p.id);
  const txt=norm(p.name+' '+p.desc), v={ch:0,fr:0,cm:0,cj:0,fs:0,in:0,cp:0,av:0,cl:0,bb:0,cn:0,kd:0};
  Object.keys(KW).forEach(k=>{v[k]=Math.min(2,KW[k].filter(w=>txt.includes(w)).length)*0.5});
  Object.entries(CATV[p.cat]||{}).forEach(([k,x])=>v[k]+=x);
  if(p.price>=16500)v.in+=1;
  if(p.price>=24000){v.cp+=2;v.in+=1}
  if(p.price<=6500)v.cl+=1;
  if(/fondue|litro|banana|bandeja de 16/.test(txt))v.cp+=2;
  if(/especial|nuevas/.test(txt))v.av+=1;
  if(/fondue|brownie caliente|chocolate caliente|waffle|donas/.test(txt))v.cn+=1;
  if(/oblea sencilla|cucurucho|concha|sundae/.test(txt))v.cl+=1;
  _pv.set(p.id,v);return v;
}
function quizScore(st){
  const u=st.tr, un=Math.sqrt(Object.values(u).reduce((a,x)=>a+x*x,0))||1;
  return DB.products.filter(p=>p.cat!=='Mascotas').map(p=>{
    const v=prodVec(p), vn=Math.sqrt(Object.values(v).reduce((a,x)=>a+x*x,0))||1;
    let s=Object.keys(u).reduce((a,k)=>a+u[k]*(v[k]||0),0)/(un*vn);
    if(st.bud&&p.price>st.bud)s-=0.35+(p.price-st.bud)/25000;
    if(st.sp.includes('DR'))s+=v.bb>=3?0.35:-0.25;
    if(st.sp.includes('DS'))s+=v.bb>=3?-0.3:0.05;
    return {p,s};
  }).sort((a,b)=>b.s-a.s);
}

let QZ=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function openQuiz(){
  closeAll();closeQuiz();
  const el=document.createElement('div');el.className='quiz';el.id='quiz';document.body.appendChild(el);
  document.body.style.overflow='hidden';QZ={step:'start',ans:[],qs:[]};quizDraw();
}
function closeQuiz(){const e=$('#quiz');if(e)e.remove();document.body.style.overflow='';QZ=null}
function quizDraw(){
  const el=$('#quiz');if(!el||!QZ)return;
  const top=`<div class="q-top"><button class="icon-btn" aria-label="Cerrar" onclick="closeQuiz()">✕</button></div>`;
  if(QZ.step==='start'){
    el.innerHTML=top+`<div class="q-card q-in"><div class="q-big">🤔</div><h2>¿No sabes qué pedir?</h2>
    <p class="q-sub">Responde unas preguntas divertidas y descubre <b>qué helado es para ti</b>. Tenemos más de <b>100 preguntas</b>: cada vez te tocan otras.</p>
    <div class="q-opts">
      <button class="q-opt" onclick="quizStart(6)"><b>⚡ Rápido</b><small>6 preguntas · 1 minuto</small></button>
      <button class="q-opt" onclick="quizStart(10)"><b>🍨 Normal</b><small>10 preguntas · el favorito</small></button>
      <button class="q-opt" onclick="quizStart(18)"><b>🕵️ Detective</b><small>18 preguntas · máxima precisión</small></button>
    </div></div>`;
  }else if(QZ.step==='q')quizQuestion(el,top);
  else quizResult(el,top);
}
function quizStart(n){
  QZ={step:'q',n,ans:[],qs:[QANCHOR[0]],i:0};quizDraw();
}
function quizState(){
  const st={tr:{},sp:[],bud:0,pet:{cabano:0,mango:0,fresa:0,galleta:0}};
  QZ.ans.forEach((oi,qi)=>{
    const f=QZ.qs[qi].o[oi].f;
    Object.entries(f.tr).forEach(([k,x])=>st.tr[k]=(st.tr[k]||0)+x);
    f.sp.forEach(t=>{
      if(/^B\d+$/.test(t))st.bud=+t.slice(1)*1000;
      else if(t.startsWith('p:'))st.pet[t.slice(2)]++;
      else st.sp.push(t);
    });
  });
  return st;
}
const QMSG=['¡Vamos bien! 🍦','Esto se pone interesante… 🔍','¡Ya casi te conozco! 😏','Hmm, tengo una sospecha 🤭','Última recta, campeón/a 🏁'];
function quizQuestion(el,top){
  const q=QZ.qs[QZ.i], total=QZ.qs.length>1&&QZ.pet?QZ.qs.length:QZ.n;
  const pct=Math.round(QZ.i/total*100);
  el.innerHTML=top+`<div class="q-card q-in" key="${QZ.i}">
    <div class="q-prog"><i style="width:${pct}%"></i></div>
    <small class="q-count">Pregunta ${QZ.i+1} de ${total}${QZ.i>0&&QZ.i%3===0?' · '+QMSG[(QZ.i/3-1)%QMSG.length]:''}</small>
    <div class="q-big">${q.e}</div><h2>${esc(q.t)}</h2>
    <div class="q-opts">${q.o.map((o,oi)=>`<button class="q-opt" onclick="quizAnswer(${oi})">${esc(o.a)}</button>`).join('')}</div>
    ${QZ.i>0?'<button class="btn btn-ghost btn-sm" style="margin-top:14px" onclick="quizBack()">← Atrás</button>':''}</div>`;
}
function quizAnswer(oi){
  QZ.ans.push(oi);
  const f=QZ.qs[QZ.i].o[oi].f;
  if(QZ.i===0){      // la primera respuesta decide el camino
    if(f.sp.includes('PET')){QZ.pet=true;QZ.qs=[QZ.qs[0],...QPET]}
    else{const rest=shuffle(QBANK).slice(0,Math.max(0,QZ.n-3));QZ.qs=[QZ.qs[0],QANCHOR[1],QANCHOR[2],...rest]}
  }
  QZ.i++;
  if(QZ.i>=QZ.qs.length)QZ.step='result';
  quizDraw();
}
function quizBack(){
  if(QZ.i<=0)return;
  QZ.ans.pop();QZ.i--;
  if(QZ.i===0){QZ.qs=[QANCHOR[0]];QZ.pet=false}
  quizDraw();
}
function confetti(){
  const E=['🍓','🍫','✨','🍦','🎉','🥭','🍪'];
  return `<div class="conf">${[...Array(16)].map((_,i)=>`<span style="left:${Math.random()*96}%;animation-delay:${(Math.random()*1.4).toFixed(2)}s;font-size:${(1.1+Math.random()*1.1).toFixed(1)}rem">${E[i%E.length]}</span>`).join('')}</div>`;
}
function quizResult(el,top){
  const st=quizState();
  if(QZ.pet)return quizPetResult(el,top,st);
  const rank=quizScore(st), best=rank[0], answered=QZ.ans.length;
  const topPct=Math.round(Math.min(97,76+answered*1.7));
  const pct=r=>Math.round(topPct*Math.max(0.55,Math.min(1,best.s>0?r.s/best.s:0.6)));
  const traits=Object.entries(st.tr).filter(([k,x])=>x>0).sort((a,b)=>b[1]-a[1]);
  const persona=traits.length?TRP[traits[0][0]]:'Todoterreno 🌎';
  const maxT=traits.length?traits[0][1]:1;
  const why=traits.slice(0,2).map(([k])=>TRL[k]);
  const alts=rank.slice(1,3);
  el.innerHTML=top+`<div class="q-card q-in q-res">${confetti()}
    <small class="q-count">Tu perfil heladero</small><h2 style="margin-bottom:12px">${persona}</h2>
    <div class="q-bars">${traits.slice(0,4).map(([k,x])=>`<div><span>${TRL[k]}</span><i><b style="width:${Math.round(x/maxT*100)}%"></b></i></div>`).join('')}</div>
    <div class="q-win"><small>Tu helado ideal es…</small>
      <h3>${best.p.emoji} ${esc(best.p.name)}</h3><span class="q-pct">${pct(best)}% de compatibilidad</span>
      <p>${esc(best.p.desc)}</p>
      ${why.length?`<p class="q-why">💡 Te lo recomendamos porque te gusta ${why.join(' y ')}.</p>`:''}
      <div class="q-price">${money(best.p.price)}</div>

function rcPreview(rebuild){
  const ph=digits($('#rc_p').value), m=ph.length>=10?findMember(DB,ph):null, amount=parseInt(digits($('#rc_a').value))||0;
  $('#rc_new').hidden=!(ph.length>=10&&!m);
  $('#rc_who').innerHTML=ph.length<10?'Escribe el celular (10 dígitos).':m?`✅ <b>${esc(m.name)}</b> · ${tierOf(DB,m).t.e} ${tierOf(DB,m).t.n} · <b>${m.points}</b> puntos${bdayEligible(m)?' · 🎂 ¡cumpleaños esta semana!':''}`:'Persona nueva.';
  const sel=$('#rc_rw');let cur=sel.value;
  if(rebuild){
    const opts=m&&amount?rewardsFor(m,amount):[];
    sel.innerHTML='<option value="">No canjea premio</option>'+opts.map(r=>`<option value="${r.id}">${r.label} · −${money(Math.min(r.value,amount))}${r.pts?' ('+r.pts+' pts)':' (gratis)'}</option>`).join('');
    if(opts.some(r=>r.id===cur))sel.value=cur;
    $('#rc_rwbox').hidden=!opts.length;cur=sel.value;
  }
  const r=cur?rewardById(cur):null, rew=r?Math.min(r.value,amount):0, base=amount-rew;
  const mult=m?tierOf(DB,m).t.mult:1, pts=Math.floor(base/1000*mult);
  const box=$('#rc_info');box.hidden=!(amount&&ph.length>=10);
  box.innerHTML=amount?`Cobrar al cliente: <b>${money(base)}</b>${rew?` <small>(compra ${money(amount)} − premio ${money(rew)})</small>`:''}<br>Puntos que ganará: <b>${pts}</b>${mult>1?` (nivel x${mult})`:''}`:'';
}
function registerPurchase(){
  const ph=digits($('#rc_p').value), amount=parseInt(digits($('#rc_a').value))||0;
  if(ph.length<10){toast('El celular debe tener 10 dígitos');return}
  let m=findMember(DB,ph), affiliated=false;
  if(!m){
    const name=$('#rc_n').value.trim(); if(!name){toast('Escribe el nombre para afiliarla');return}
    const ref=digits($('#rc_r').value); if(ref&&!findMember(DB,ref)){toast('El celular de quien la invitó no está afiliado');return}
    const b=$('#rc_b').value; m=newMember(DB,name,ph,b?b.slice(5):'',ref);affiliated=true;
  }
  if(!amount){save();render();adminTab='registrar';toast(affiliated?'✅ '+m.name+' quedó afiliado/a al Club':'Ya estaba afiliado/a');return}
  const rid=$('#rc_rw').value, r=rid?rewardById(rid):null;
  if(r&&!(r.pts===0?bdayEligible(m):m.points>=r.pts)||(r&&amount<r.value)){toast('Ese premio no está disponible para esta compra');return}
  const rew=r?Math.min(r.value,amount):0, base=amount-rew, id=Math.max(...DB.orders.map(o=>o.id),999)+1;
  const o={id,customer:m.name,phone:m.phone,items:[],total:base,base,ship:0,combo:0,rew:r?{id:r.id,pts:r.pts,value:rew}:null,status:'Pendiente',date:new Date().toISOString(),method:'Mostrador',src:'mostrador'};
  DB.orders.push(o);
  if(r)spendReward(m,r,id);
  clubOnStatus(o,'Entregado');o.status='Entregado';
  save();render();
  toast(`✅ ${m.name}: +${o.pointsAwarded||0} puntos${affiliated?' · afiliado/a':''}`);
}

    <li>Revisa <b>⚠️ reactivar</b> en el Resumen: son afiliados que llevan más de 30 días sin comprar. Un mensaje a tiempo los trae de vuelta.</li></ul></div>

  <div class="panel"><h3>📊 ¿Cómo sé si el Club funciona?</h3>
    <p>En el <b>Resumen</b> mira: cuántos miembros hay, cuántos puntos hay sin canjear, cuánto se ha regalado en premios (y su costo real) y qué porcentaje de las ventas de socios representa. La meta es que el Club devuelva entre un 10% y un 13% en premios (≈ ${Math.round(10*c*10)/10}% a ${Math.round(13*c*10)/10}% de costo real) y que los afiliados compren más seguido.</p>
    <div class="note">Esta es una demostración: los datos se guardan solo en este dispositivo.</div></div>
  </div>`;
}
