<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gro’smania · Heladería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#0fb5a3; --pink2:#5fe0d1; --mint:#7fd85e; --vanilla:#ffe9a8; --choco:#4a2c2a;
  --violet:#35b6ee; --orange:#ffb454; --blue:#38bdf8;
  --bg:#f2fbfa; --card:#ffffff; --ink:#16302f; --muted:#6b8688; --line:#d9f0ee;
  --shadow:0 10px 30px rgba(15,181,163,.15); --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.brand{font-family:Fredoka,Inter,sans-serif;letter-spacing:.2px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:600;transition:.2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;box-shadow:0 8px 20px rgba(15,181,163,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,181,163,.45)}
.btn-ghost{background:#fff;border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--pink);color:var(--pink)}
.btn-danger{background:#ffe6e6;color:#d6285c}
.btn-sm{padding:7px 14px;font-size:.85rem}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);transition:.2s;position:relative}
.icon-btn:hover{border-color:var(--pink);transform:scale(1.06)}

/* ---------- NAV ---------- */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 5vw;background:rgba(242,251,250,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span.logo{font-size:1.9rem;-webkit-text-fill-color:initial}
.nav-links{display:flex;gap:26px;font-weight:500}
.nav-links a{color:var(--muted);text-decoration:none;transition:.2s}
.nav-links a:hover{color:var(--pink)}
.nav-actions{display:flex;gap:10px;align-items:center}
.badge{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;font-size:.7rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* ---------- HERO ---------- */
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:60px 5vw 80px;overflow:hidden}
.hero::before{content:"";position:absolute;width:520px;height:520px;right:-120px;top:-120px;background:radial-gradient(circle,rgba(53,182,238,.25),transparent 65%);z-index:0}
.hero::after{content:"";position:absolute;width:420px;height:420px;left:-140px;bottom:-160px;background:radial-gradient(circle,rgba(127,216,94,.25),transparent 65%);z-index:0}
.hero>*{position:relative;z-index:1}
.pill{display:inline-block;background:#fff;border:1.5px solid var(--line);padding:6px 14px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--pink);margin-bottom:18px}
.hero h1{font-size:clamp(2.6rem,6vw,4.8rem);line-height:1.02;font-weight:700}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:20px 0 28px;font-size:1.1rem;color:var(--muted);max-width:480px;line-height:1.6}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-stats{display:flex;gap:30px;margin-top:38px}
.hero-stats b{font-family:Fredoka;font-size:1.8rem;display:block}
.hero-stats small{color:var(--muted)}
.scoop-stage{position:relative;height:460px;display:grid;place-items:center}
.collage{position:relative;width:440px;height:440px;animation:float 5s ease-in-out infinite}.collage img{position:absolute;object-fit:cover;border:6px solid #fff;box-shadow:0 24px 50px rgba(15,80,75,.28)}.c1{width:250px;height:300px;left:0;top:40px;border-radius:30px;transform:rotate(-6deg)}.c2{width:230px;height:290px;right:0;top:0;border-radius:30px;transform:rotate(5deg)}.c3{width:170px;height:170px;left:135px;bottom:0;border-radius:50%;background:#fff;border-width:5px}.product .pic{position:relative;overflow:hidden}.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero>*{min-width:0}@media(max-width:980px){.collage{width:300px;height:330px;animation:none}.c1{width:170px;height:210px;top:30px}.c2{width:160px;height:200px}.c3{width:120px;height:120px;left:90px}}.logo-img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.2);-webkit-text-fill-color:initial}.cone{font-size:15rem;filter:drop-shadow(0 30px 30px rgba(53,182,238,.3));animation:float 4s ease-in-out infinite}
.sprinkle{position:absolute;font-size:2.6rem;animation:float 5s ease-in-out infinite}
.s1{top:6%;left:8%;animation-delay:-1s}.s2{top:14%;right:6%;animation-delay:-2s}.s3{bottom:12%;left:2%;animation-delay:-3s}.s4{bottom:6%;right:10%;animation-delay:-.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
.wave{display:block;width:100%;height:60px;margin-top:-1px}

/* ---------- Secciones ---------- */
section{padding:70px 5vw}
.sec-head{text-align:center;margin-bottom:36px}
.sec-head h2{font-size:clamp(2rem,4vw,3rem)}
.sec-head p{color:var(--muted);margin-top:8px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.chip{padding:9px 20px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;transition:.2s}
.chip.active,.chip:hover{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:24px}
.product{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:.25s;position:relative;overflow:hidden}
.product:hover{transform:translateY(-8px) rotate(-.6deg)}
.product .pic{height:150px;border-radius:18px;display:grid;place-items:center;font-size:5.2rem;margin-bottom:14px;transition:.3s}
.product:hover .pic{transform:scale(1.05)}
.product h3{font-size:1.25rem}
.product p{color:var(--muted);font-size:.88rem;margin:4px 0 14px;min-height:38px}
.product .row{display:flex;align-items:center;justify-content:space-between}
.price{font-family:Fredoka;font-size:1.3rem;font-weight:600;color:var(--pink)}
.tag{position:absolute;top:14px;left:14px;background:#fff;border-radius:999px;font-size:.72rem;font-weight:700;padding:4px 10px;color:var(--violet);z-index:2}
.soldout{opacity:.55;filter:grayscale(.6)}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;background:linear-gradient(135deg,#e6fbf8,#e8f6ff)}
.feat{background:#fff;border-radius:var(--r);padding:28px;text-align:center;box-shadow:var(--shadow)}
.feat i{font-style:normal;font-size:2.8rem;display:block;margin-bottom:10px}
.feat p{color:var(--muted);font-size:.92rem;margin-top:6px}
.promo{margin:0 5vw;border-radius:32px;padding:50px;background:linear-gradient(120deg,var(--violet),var(--pink) 60%,var(--orange));color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.promo h2{font-size:clamp(1.8rem,3.5vw,2.8rem)}
.promo code{background:rgba(255,255,255,.22);padding:4px 12px;border-radius:10px;font-weight:700;letter-spacing:1px}
.promo .big{position:absolute;right:30px;top:-20px;font-size:10rem;opacity:.18}
footer{padding:40px 5vw;text-align:center;color:var(--muted);border-top:1px solid var(--line);margin-top:50px}

/* ---------- Drawer / Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(43,27,46,.45);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;z-index:100;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.15)}
.drawer.show{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:22px;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:18px 22px}
.drawer footer{border:0;margin:0;padding:18px 22px;border-top:1px solid var(--line);text-align:left}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cart-item .e{font-size:2.2rem;width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
.cart-item .info{flex:1}.cart-item .info small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font-weight:700}
.qty button:hover{border-color:var(--pink);color:var(--pink)}
.sum-row{display:flex;justify-content:space-between;margin:6px 0}
.sum-row.total{font-family:Fredoka;font-size:1.4rem;font-weight:600;margin-top:12px}
.coupon{display:flex;gap:8px;margin:12px 0}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:110;pointer-events:none;padding:16px}
.modal>div{background:#fff;border-radius:26px;padding:28px;width:min(520px,100%);max-height:92vh;overflow:auto;transform:scale(.92);opacity:0;transition:.25s;pointer-events:none}
.modal.show>div{transform:none;opacity:1;pointer-events:auto}
.modal h3{font-size:1.5rem;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0;transition:.2s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(15,181,163,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-g{margin-bottom:14px}.opt-g>b{display:block;font-size:.9rem;margin-bottom:6px}.opt-g select{width:100%;margin-bottom:6px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff}
.addons{display:grid;gap:6px;max-height:210px;overflow:auto}.addons label{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:.88rem}.addons label:has(input:checked){border-color:var(--pink);background:#e6fbf8}
.cart-item small.det{display:block;color:var(--muted);margin-top:2px;line-height:1.3}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .3s}
@keyframes pop{from{transform:translateY(20px);opacity:0}}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#d5f7f1,#e3f4ff 55%,#fbf9d0);position:relative;overflow:hidden}
.login .card{background:#fff;border-radius:30px;padding:40px;width:min(420px,100%);box-shadow:0 30px 70px rgba(53,182,238,.25);position:relative;z-index:2;text-align:center}
.login .card .brand{justify-content:center;margin-bottom:6px}
.login .card p{color:var(--muted);margin-bottom:22px}
.login .field{text-align:left}
.hint{margin-top:16px;background:#e8f9f7;border-radius:14px;padding:10px;font-size:.82rem;color:var(--violet)}
.login .f{position:absolute;font-size:5rem;opacity:.5;animation:float 6s ease-in-out infinite}

/* ---------- ADMIN ---------- */
.admin{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0f3b3a,#145a55);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{margin:0 8px 24px;background:none;color:#fff;-webkit-text-fill-color:#fff}
.side button.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:16px;color:#b7dcd8;font-weight:500;text-align:left;transition:.2s}
.side button.item:hover{background:rgba(255,255,255,.08);color:#fff}
.side button.item.active{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;box-shadow:0 8px 20px rgba(15,181,163,.35)}
.side .sp{flex:1}
.me{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);padding:12px;border-radius:16px;margin-bottom:8px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--blue));display:grid;place-items:center;font-weight:700;color:#06352b}
.me small{color:#b7dcd8;display:block}
.main{padding:28px 32px 50px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.top h1{font-size:2rem}.top p{color:var(--muted)}
.menu-toggle{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:22px}
.kpi{border-radius:var(--r);padding:22px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.12)}
.kpi::after{content:attr(data-e);position:absolute;right:-6px;bottom:-14px;font-size:5.5rem;opacity:.22}
.kpi small{opacity:.9;font-weight:500}
.kpi b{display:block;font-family:Fredoka;font-size:2rem;margin:6px 0 2px}
.kpi span{font-size:.82rem;opacity:.9}
.k1{background:linear-gradient(135deg,#0fb5a3,#5fe0b8)}.k2{background:linear-gradient(135deg,#35b6ee,#6a8cff)}
.k3{background:linear-gradient(135deg,#7fd85e,#34c4a0)}.k4{background:linear-gradient(135deg,#ff8fa3,#ff6b8b)}
.panel{background:#fff;border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:22px}
.panel h3{font-size:1.2rem;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:22px}
.cols>.panel{margin-bottom:22px;min-width:0}
.bars{display:flex;align-items:flex-end;gap:14px;height:230px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bar i{display:block;width:100%;max-width:56px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,var(--pink),var(--violet));transition:.5s;min-height:4px;position:relative}
.bar i:hover{filter:brightness(1.12)}
.bar i::before{content:attr(data-v);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700;color:var(--muted);white-space:nowrap}
.bar small{color:var(--muted);font-size:.78rem}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:30px;background:#fff;border-radius:50%}
.legend{display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
tr:hover td{background:#f5fffd}
.status{padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:700;display:inline-block}
.st-Pendiente{background:#fff3d6;color:#b77900}.st-Preparando{background:#d9f0ff;color:#1b73b8}
.st-Listo{background:#d6f7ee;color:#0f8f70}.st-Entregado{background:#dff1ff;color:#1b73b8}
.st-Cancelado{background:#ffe3ea;color:#d6285c}
td select{padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input,.toolbar select{padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;outline:0}
.toolbar input:focus{border-color:var(--pink)}
.toolbar .grow{flex:1;min-width:180px}
.mini{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.mini:last-child{border:0}
.mini .e{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.7rem}
.mini .grow{flex:1;min-width:0}.mini small{color:var(--muted)}
.progress{height:8px;background:#e1f2f0;border-radius:6px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--mint),var(--blue))}
.progress i.low{background:linear-gradient(90deg,var(--orange),#ff5f6d)}
.switch{position:relative;width:46px;height:26px;display:inline-block}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:#d3e6e4;border-radius:20px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--mint)}
.switch input:checked+span::after{transform:translateX(20px)}
.empty{text-align:center;color:var(--muted);padding:30px}
.st-Confirmada{background:#d6f7ee;color:#0f8f70}.st-Completada{background:#dff1ff;color:#1b73b8}
.reserve{background:linear-gradient(135deg,#e6fbf8,#e8f6ff 60%,#f2fbe0);display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center}
.reserve h2{font-size:clamp(2rem,4vw,3rem);margin-bottom:10px}
.reserve .lead{color:var(--muted);line-height:1.6;margin-bottom:20px}
.reserve ul{list-style:none;display:grid;gap:10px;font-weight:500}
.reserve .form{background:#fff;border-radius:28px;padding:30px;box-shadow:var(--shadow)}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.rep{background:#fff;border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.rep .ic{font-size:2.2rem}.rep p{color:var(--muted);font-size:.88rem;flex:1}
.rep .meta{font-size:.8rem;color:var(--violet);font-weight:600}
.rep .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px}
.seg button{padding:7px 18px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button.on{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff}
@media(max-width:980px){.reserve{grid-template-columns:1fr}}

@media(max-width:980px){
  .hero{grid-template-columns:1fr;text-align:center}.hero p{margin-inline:auto}.hero-cta,.hero-stats{justify-content:center}
  .scoop-stage{height:320px}.cone{font-size:10rem}
  .nav-links{display:none}
  .cols{grid-template-columns:1fr}
  .admin{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:95;width:270px;transform:translateX(-100%);transition:.3s}
  .side.open{transform:none}
  .menu-toggle{display:grid}
  .main{padding:20px 16px 40px}
  .promo{padding:30px}
}
</style>
</head>
<body>

<div id="app"></div>
<div class="overlay" id="overlay"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* =========================================================
   DATOS
   ========================================================= */
const KEY = 'grosmania.v2';
const CATS = ['Copas','Nuevas creaciones','Ensaladas','Malteadas','Waffles','Minidonas','Obleas','Chocolate','Conos y vasos','Infantiles','Bebidas','Mascotas'];

/* ---------- Carrito ---------- */
const needsCustom=p=>(p.opts&&p.opts.length)||p.adds||(p.addons&&p.addons.length);
const addonsOf=p=>[...(p.adds?ADICIONES:[]),...(p.addons||[])];
const listOf=g=>g.list==='flavors'?DB.settings.flavors:g.list;
const qtyOf=id=>cart.filter(l=>l.id===id).reduce((a,l)=>a+l.qty,0);
function lineDetail(l){
  const parts=(l.sel||[]).map(x=>x.label.replace(/ \(\d\)$/,'')+': '+x.v.join(', '));
  if(l.adds&&l.adds.length)parts.push('Adiciones: '+l.adds.join(', '));
  if(l.note)parts.push('Nota: '+l.note);
  return parts.join(' · ');
}
function pushLine(p,sel,adds,note){
  if(qtyOf(p.id)+1>p.stock){toast('No hay más stock de '+p.name);return}
  const extra=addonsOf(p).filter(a=>adds.includes(a[0])).reduce((x,a)=>x+a[1],0);
  const key=JSON.stringify([p.id,sel,adds,note]);
  const it=cart.find(l=>l.key===key);
  if(it)it.qty++;else cart.push({key,id:p.id,qty:1,sel,adds,note,unit:p.price+extra});
  toast(p.emoji+' '+p.name+' agregado'); render();
}
function addCart(id){
  const p=prod(id);
  if(needsCustom(p))return openCustom(id);
  pushLine(p,[],[],'');
}
function openCustom(id){
  closeCheckout();
  const p=prod(id), ads=addonsOf(p);
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div><h3>${p.emoji} ${esc(p.name)}</h3>
  <p style="color:var(--muted);margin:-8px 0 14px;font-size:.9rem">${esc(p.desc)}</p>
  ${(p.opts||[]).map((g,gi)=>`<div class="opt-g"><b>${esc(g.label)}</b>${[...Array(g.n)].map((_,i)=>`<select id="oc_${gi}_${i}"><option value="">Elige${g.n>1?' ('+(i+1)+')':''}…</option>${listOf(g).map(v=>`<option>${esc(v)}</option>`).join('')}</select>`).join('')}</div>`).join('')}
  ${ads.length?`<div class="opt-g"><b>${p.adds?'Adiciones (opcional)':'Extras (opcional)'}</b><div class="addons">${ads.map((a,j)=>`<label><span><input type="checkbox" id="oc_a_${j}" onchange="ocTotal(${id})"> ${esc(a[0])}</span><span>+${money(a[1])}</span></label>`).join('')}</div></div>`:''}
  <div class="field"><label>Nota para la cocina (opcional)</label><input id="oc_note" maxlength="120" placeholder="Ej. sin queso, para llevar…"></div>
  <div class="sum-row total"><span>Total</span><span id="oc_total">${money(p.price)}</span></div>
  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeCheckout()">Cancelar</button><button class="btn btn-primary" onclick="confirmCustom(${id})">Agregar al pedido</button></div></div>`;
  document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add('show'));
}
function ocPicked(p){return addonsOf(p).filter((a,j)=>{const el=document.getElementById('oc_a_'+j);return el&&el.checked}).map(a=>a[0])}
function ocTotal(id){
  const p=prod(id),sel=ocPicked(p);
  $('#oc_total').textContent=money(p.price+addonsOf(p).filter(a=>sel.includes(a[0])).reduce((x,a)=>x+a[1],0));
}
function confirmCustom(id){
  const p=prod(id), sel=[];
  for(let gi=0;gi<(p.opts||[]).length;gi++){
    const g=p.opts[gi], v=[...Array(g.n)].map((_,i)=>document.getElementById(`oc_${gi}_${i}`).value);
    if(v.some(x=>!x)){toast('Falta elegir: '+g.label);return}
    sel.push({label:g.label,v});
  }
  pushLine(p,sel,ocPicked(p),$('#oc_note').value.trim());
  closeCheckout();
}
function chQty(i,d){
  const l=cart[i]; if(!l)return;
  if(d>0&&qtyOf(l.id)+1>prod(l.id).stock){toast('Stock máximo alcanzado');return}
  l.qty+=d; if(l.qty<=0)cart.splice(i,1);
  render(); openCart(true);
}
function totals(){
  const sub=cart.reduce((a,l)=>a+l.unit*l.qty,0);
  const disc=coupon?Math.round(sub*coupon.pct/100):0;
  const ship=sub>0?DB.settings.delivery:0;
  return {sub,disc,ship,total:sub-disc+ship};
}
function openCart(keep){
  document.querySelectorAll('.drawer').forEach(e=>e.remove());
  const t=totals();
  const d=document.createElement('aside');d.className='drawer';
  d.innerHTML=`<header><h3>Tu pedido 🛒</h3><button class="icon-btn" onclick="closeAll()">✕</button></header>
  <div class="body">${cart.length?cart.map((l,ix)=>{const p=prod(l.id);return `
    <div class="cart-item"><div class="e" style="background:${COLORS[p.cat]}">${p.emoji}</div>
    <div class="info"><b>${esc(p.name)}</b><br><small>${money(l.unit)}</small>${lineDetail(l)?`<small class="det">${esc(lineDetail(l))}</small>`:''}</div>
    <div class="qty"><button onclick="chQty(${ix},-1)">−</button><b>${l.qty}</b><button onclick="chQty(${ix},1)">＋</button></div></div>`}).join('')
    :'<p class="empty">Tu carrito está vacío 🍨<br>¡Agrega algo delicioso!</p>'}</div>
  <footer>
    <div class="coupon"><input id="cpn" placeholder="Código de descuento" style="flex:1;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line)" value="${coupon?coupon.code:''}"><button class="btn btn-ghost btn-sm" onclick="applyCoupon()">Aplicar</button></div>
    <div class="sum-row"><span>Subtotal</span><span>${money(t.sub)}</span></div>
    ${coupon?`<div class="sum-row" style="color:var(--mint)"><span>Descuento ${coupon.pct}%</span><span>−${money(t.disc)}</span></div>`:''}
    <div class="sum-row"><span>Domicilio</span><span>${money(t.ship)}</span></div>
    <div class="sum-row total"><span>Total</span><span>${money(t.total)}</span></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px" ${cart.length?'':'disabled'} onclick="openCheckout()">Finalizar pedido</button>
  </footer>`;
  document.body.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('show')); showOverlay(true);
}
function refreshCart(){}
function applyCoupon(){
  const code=$('#cpn').value.trim().toUpperCase();
  const c=DB.coupons.find(c=>c.code===code&&c.active);
  if(!code){coupon=null}else if(!c){toast('Cupón no válido ❌');return}else{coupon=c;toast('Cupón aplicado 🎉')}
  openCart(true);
}
function openCheckout(){
  document.querySelectorAll('.modal').forEach(e=>e.remove());
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div><h3>Casi listo 🎉</h3>
    <div class="field"><label>Tu nombre</label><input id="co_name" placeholder="Ej. Laura Gómez"></div>
    <div class="two"><div class="field"><label>Modalidad</label><select id="co_m"><option>Domicilio</option><option>Local</option></select></div>
    <div class="field"><label>Teléfono</label><input id="co_t" placeholder="300 000 0000"></div></div>
    <p style="margin-bottom:14px;color:var(--muted)">Total a pagar: <b style="color:var(--pink)">${money(totals().total)}</b></p>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeCheckout()">Cancelar</button><button class="btn btn-primary" onclick="placeOrder()">Confirmar pedido</button></div></div>`;
  document.body.appendChild(m); requestAnimationFrame(()=>m.classList.add('show'));
}
function closeCheckout(){document.querySelectorAll('.modal').forEach(e=>e.remove())}
function placeOrder(){
  const name=$('#co_name').value.trim(); if(!name){toast('Escribe tu nombre');return}
  const t=totals();
  const id=Math.max(...DB.orders.map(o=>o.id),999)+1;
  DB.orders.push({id,customer:name,items:cart.map(l=>({id:l.id,qty:l.qty,price:l.unit,sel:l.sel,adds:l.adds,note:l.note})),total:t.total,status:'Pendiente',date:new Date().toISOString(),method:$('#co_m').value});
  cart.forEach(l=>{prod(l.id).stock-=l.qty});
  if(coupon){coupon.uses=(coupon.uses||0)+1}
  cart=[];coupon=null;save();closeAll();render();toast('¡Pedido #'+id+' enviado! 🍨');
}

function dashboard(){
  const valid=DB.orders.filter(o=>o.status!=='Cancelado');
  const today=valid.filter(o=>sameDay(o.date,Date.now()));
  const sumToday=today.reduce((a,o)=>a+o.total,0);
  const sumAll=valid.reduce((a,o)=>a+o.total,0);
  const avg=valid.length?Math.round(sumAll/valid.length):0;
  const low=DB.products.filter(p=>p.stock<=10);
  // últimos 7 días
  const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);
    const tot=valid.filter(o=>sameDay(o.date,d)).reduce((a,o)=>a+o.total,0);
    return {l:d.toLocaleDateString('es-CO',{weekday:'short'}),v:tot}});
  const max=Math.max(...days.map(d=>d.v),1);
  // por categoría + top productos
  const byCat={},byProd={};
  valid.forEach(o=>o.items.forEach(i=>{const p=prod(i.id);if(!p)return;const v=(i.price??p.price)*i.qty;byCat[p.cat]=(byCat[p.cat]||0)+v;byProd[p.id]=(byProd[p.id]||0)+i.qty}));
  const catCol=CAT_COLOR;
  const totCat=Object.values(byCat).reduce((a,b)=>a+b,0)||1;
  let acc=0;const stops=Object.entries(byCat).map(([k,v])=>{const s=acc;acc+=v/totCat*100;return `${catCol[k]} ${s}% ${acc}%`}).join(',');
  const top=Object.entries(byProd).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topMax=top[0]?top[0][1]:1;
  const recent=[...DB.orders].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  return `
  <div class="kpis">
    <div class="kpi k1" data-e="💰"><small>Ventas de hoy</small><b>${money(sumToday)}</b><span>${today.length} pedidos hoy</span></div>
    <div class="kpi k2" data-e="📈"><small>Ventas (7 días)</small><b>${money(sumAll)}</b><span>${valid.length} pedidos válidos</span></div>
    <div class="kpi k3" data-e="🧾"><small>Ticket promedio</small><b>${money(avg)}</b><span>por pedido</span></div>
    <div class="kpi k4" data-e="⚠️"><small>Stock bajo</small><b>${low.length}</b><span>productos por reponer</span></div>
  </div>
  <div class="cols">
    <div class="panel"><h3>Ventas de los últimos 7 días</h3>
      <div class="bars">${days.map(d=>`<div class="bar"><i style="height:${Math.max(d.v/max*100,2)}%" data-v="${d.v?Math.round(d.v/1000)+'k':''}"></i><small>${d.l}</small></div>`).join('')}</div></div>
    <div class="panel"><h3>Ventas por categoría</h3>
      <div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops||'#eee 0 100%'})"></div>
      <div class="legend">${Object.entries(byCat).map(([k,v])=>`<span><i style="background:${catCol[k]}"></i>${k} · ${Math.round(v/totCat*100)}%</span>`).join('')}</div></div></div>
  </div>
  <div class="cols">
    <div class="panel"><h3>Pedidos recientes <button class="btn btn-ghost btn-sm" onclick="setTab('orders')">Ver todos</button></h3>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>
      ${recent.map(o=>`<tr><td><b>#${o.id}</b></td><td>${esc(o.customer)}<br><small style="color:var(--muted)">${fmtDate(o.date)}</small></td><td>${money(o.total)}</td><td><span class="status st-${o.status}">${o.status}</span></td></tr>`).join('')}
      </tbody></table></div></div>
    <div>
      <div class="panel"><h3>🏆 Más vendidos</h3>
      ${top.map(([id,q])=>{const p=prod(+id);return `<div class="mini"><div class="e" style="background:${COLORS[p.cat]}">${p.emoji}</div><div class="grow"><b>${esc(p.name)}</b><div class="progress"><i style="width:${q/topMax*100}%"></i></div></div><b>${q}</b></div>`}).join('')||'<p class="empty">Aún sin ventas</p>'}</div>
      <div class="panel"><h3>⚠️ Alertas de stock</h3>
      ${low.map(p=>`<div class="mini"><div class="e" style="background:${COLORS[p.cat]}">${p.emoji}</div><div class="grow"><b>${esc(p.name)}</b><br><small>${p.stock} unidades</small></div><button class="btn btn-ghost btn-sm" onclick="restock(${p.id})">+20</button></div>`).join('')||'<p class="empty">Todo el inventario está bien 🎉</p>'}</div>
    </div>
  </div>`;

function renderKeep(id){
  const pos=document.getElementById(id).selectionStart;render();
  const el=document.getElementById(id);el.focus();el.setSelectionRange(pos,pos);
}
function setStatus(id,s){
  const o=DB.orders.find(o=>o.id===id);
  if(s==='Cancelado'&&o.status!=='Cancelado'){o.items.forEach(i=>{const p=prod(i.id);if(p)p.stock+=i.qty})}
  if(o.status==='Cancelado'&&s!=='Cancelado'){o.items.forEach(i=>{const p=prod(i.id);if(p)p.stock=Math.max(0,p.stock-i.qty)})}
  o.status=s;save();render();toast('Pedido #'+id+' → '+s);
}
function viewOrder(id){
  const o=DB.orders.find(o=>o.id===id);

function slotTaken(date,time,exceptId){
  return DB.reservations.filter(r=>r.id!==exceptId&&r.date===date&&r.time===time&&r.status!=='Cancelada').length;
}
function addReservation(d,exceptId){
  if(d.date<ymd(0)){toast('La fecha no puede ser pasada');return false}
  if(slotTaken(d.date,d.time,exceptId)>=DB.settings.tables){toast('Esa hora está llena. Elige otra 🙏');return false}
  return true;
}

  const d={name:$('#ar_n').value.trim(),phone:$('#ar_t').value.trim(),date:$('#ar_d').value,time:$('#ar_h').value,people:Math.max(1,+$('#ar_p').value||1),occasion:$('#ar_o').value,status:$('#ar_s').value,notes:$('#ar_x').value.trim()};

/* =========================================================
   REPORTES
   ========================================================= */
function periodOrders(){
  const now=Date.now();
  return DB.orders.filter(o=>repPeriod==='hoy'?sameDay(o.date,now):repPeriod==='7'?new Date(o.date)>=now-7*864e5:true);
}
const PERIOD_LABEL={hoy:'Hoy','7':'Últimos 7 días',todo:'Todo el historial'};
function buildReport(kind){
  const orders=periodOrders(), valid=orders.filter(o=>o.status!=='Cancelado');
  if(kind==='ventas')return {title:'Ventas y pedidos',headers:['Pedido','Fecha','Cliente','Tipo','Estado','Artículos','Total (COP)'],
    rows:[...orders].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(o=>[o.id,new Date(o.date).toLocaleString('es-CO'),o.customer,o.method,o.status,o.items.reduce((a,i)=>a+i.qty,0),o.total])};
  if(kind==='productos'){
    const m={};valid.forEach(o=>o.items.forEach(i=>{const p=prod(i.id);if(!p)return;const x=m[p.id]||(m[p.id]={p,q:0,v:0});x.q+=i.qty;x.v+=i.qty*(i.price??p.price)}));
    return {title:'Productos vendidos',headers:['Producto','Categoría','Unidades vendidas','Ingresos (COP)'],rows:Object.values(m).sort((a,b)=>b.v-a.v).map(x=>[x.p.name,x.p.cat,x.q,x.v])};
  }
  if(kind==='inventario')return {title:'Inventario',headers:['Producto','Categoría','Precio (COP)','Stock','Estado','Valor a precio de venta (COP)','Visible en tienda'],
    rows:DB.products.map(p=>[p.name,p.cat,p.price,p.stock,p.stock<=0?'Agotado':p.stock<=10?'Stock bajo':'OK',p.price*p.stock,p.active?'Sí':'No'])};
  if(kind==='clientes'){
    const m={};valid.forEach(o=>{const c=m[o.customer]||(m[o.customer]={n:o.customer,q:0,t:0,l:o.date});c.q++;c.t+=o.total;if(o.date>c.l)c.l=o.date});
    return {title:'Clientes',headers:['Cliente','Pedidos','Total gastado (COP)','Última compra'],rows:Object.values(m).sort((a,b)=>b.t-a.t).map(c=>[c.n,c.q,c.t,new Date(c.l).toLocaleDateString('es-CO')])};
  }
  if(kind==='reservas')return {title:'Reservas',headers:['Fecha','Hora','Nombre','Teléfono','Personas','Ocasión','Estado','Notas'],
    rows:[...DB.reservations].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(r=>[r.date,r.time,r.name,r.phone,r.people,r.occasion,r.status,r.notes])};
}
function downloadFile(name,content,type){
  const blob=new Blob([content],{type});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function downloadReport(kind){
  const r=buildReport(kind);
  const cell=v=>{v=String(v??'');return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  // BOM + separador «;» para que Excel en español abra las columnas directamente
  const csv='﻿'+[r.headers,...r.rows].map(row=>row.map(cell).join(';')).join('\r\n');
  downloadFile(`grosmania_${kind}_${ymd(0)}.csv`,csv,'text/csv;charset=utf-8');
  toast('⬇ '+r.title+': '+r.rows.length+' filas descargadas');
}
function execHTML(){
  const orders=periodOrders(), valid=orders.filter(o=>o.status!=='Cancelado');
  const sum=valid.reduce((a,o)=>a+o.total,0), avg=valid.length?Math.round(sum/valid.length):0;
  const tbl=r=>`<table><thead><tr>${r.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${r.rows.slice(0,15).map(row=>`<tr>${row.map(c=>`<td>${typeof c==='number'&&c>999?money(c):esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td>Sin datos</td></tr>'}</tbody></table>`;
  const t0=ymd(0), resNext=DB.reservations.filter(r=>r.date>=t0&&r.status!=='Cancelada');
  return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Reporte ejecutivo · ${esc(DB.settings.name)}</title>
  <style>body{font-family:Segoe UI,Arial,sans-serif;color:#2b1b2e;max-width:900px;margin:30px auto;padding:0 24px}
  h1{color:#ff5fa2;margin-bottom:0}h2{margin:28px 0 8px;border-bottom:2px solid #f1e3ee;padding-bottom:6px;color:#7c5cff}
  .k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.k div{border:1.5px solid #f1e3ee;border-radius:14px;padding:14px}.k b{display:block;font-size:1.3rem}
  table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:7px 8px;border-bottom:1px solid #f1e3ee;text-align:left}th{background:#fff0f7}
  small{color:#85738a}@media print{body{margin:0}}</style></head><body>
  <h1>🍨 ${esc(DB.settings.name)}</h1><small>Reporte ejecutivo · ${esc(PERIOD_LABEL[repPeriod])} · generado el ${new Date().toLocaleString('es-CO')}</small>
  <div class="k"><div><small>Ventas</small><b>${money(sum)}</b></div><div><small>Pedidos válidos</small><b>${valid.length}</b></div><div><small>Ticket promedio</small><b>${money(avg)}</b></div><div><small>Cancelados</small><b>${orders.length-valid.length}</b></div></div>
  <h2>Productos más vendidos</h2>${tbl(buildReport('productos'))}
  <h2>Clientes principales</h2>${tbl(buildReport('clientes'))}
  <h2>Inventario</h2>${tbl(buildReport('inventario'))}
  <h2>Reservas próximas (${resNext.length})</h2>${tbl({headers:['Fecha','Hora','Nombre','Personas','Estado'],rows:resNext.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(r=>[r.date,r.time,r.name,r.people,r.status])})}
  </body></html>`;
}
function printExec(){
  const w=window.open('','_blank');
  if(!w){toast('El navegador bloqueó la ventana. Usa «Descargar HTML»');return}
  w.document.write(execHTML());w.document.close();setTimeout(()=>w.print(),400);
}
function downloadExec(){downloadFile(`grosmania_reporte-ejecutivo_${ymd(0)}.html`,execHTML(),'text/html;charset=utf-8');toast('⬇ Reporte ejecutivo descargado')}
function setPeriod(p){repPeriod=p;render()}
function reportsTab(){
  const cards=[
    ['ventas','🧾','Ventas y pedidos','Cada pedido con fecha, cliente, tipo, estado y total.',true],
    ['productos','🍨','Productos vendidos','Unidades e ingresos por producto, ordenados de mayor a menor.',true],
    ['clientes','👥','Clientes','Pedidos y gasto acumulado por cliente.',true],
    ['inventario','📦','Inventario','Stock actual, estado y valor del inventario. No depende del período.',false],
    ['reservas','📅','Reservas','Todas las reservas con contacto, ocasión y estado. No depende del período.',false]
  ];
  const o=periodOrders().filter(o=>o.status!=='Cancelado');
  return `
  <div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
    <div><b>Período del reporte</b><br><small style="color:var(--muted)">${o.length} pedidos válidos · ${money(o.reduce((a,x)=>a+x.total,0))} en ventas</small></div>
    <div class="seg">${[['hoy','Hoy'],['7','7 días'],['todo','Todo']].map(([k,l])=>`<button class="${repPeriod===k?'on':''}" onclick="setPeriod('${k}')">${l}</button>`).join('')}</div>
  </div>
  <div class="rep-grid">
  ${cards.map(([k,e,t,d,p])=>{const n=buildReport(k).rows.length;return `<div class="rep"><span class="ic">${e}</span><h3>${t}</h3><p>${d}</p><span class="meta">${n} filas${p?' · '+PERIOD_LABEL[repPeriod]:''}</span>
    <div class="acts"><button class="btn btn-primary btn-sm" onclick="downloadReport('${k}')">⬇ CSV (Excel)</button></div></div>`}).join('')}
    <div class="rep" style="background:linear-gradient(135deg,#e6fbf8,#e8f6ff)"><span class="ic">📄</span><h3>Reporte ejecutivo</h3><p>Resumen listo para imprimir o guardar como PDF: KPIs, top productos, clientes, inventario y reservas.</p><span class="meta">${PERIOD_LABEL[repPeriod]}</span>
    <div class="acts"><button class="btn btn-primary btn-sm" onclick="printExec()">🖨 Imprimir / PDF</button><button class="btn btn-ghost btn-sm" onclick="downloadExec()">⬇ HTML</button></div></div>
  </div>`;
}

$('#overlay').addEventListener('click',closeAll);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
(function(){
  const h=location.hash;
  if(/^#admin/.test(h)){isAdmin=true;route='admin';adminTab=(h.split('/')[1])||'dashboard'}
  if(h==='#cart'){const mk=(n,q)=>{const p=DB.products.find(x=>x.name===n);return {key:n,id:p.id,qty:q,sel:[],adds:[],note:'',unit:p.price}};cart=[mk('Fresas Grandes',1),mk('Gro’smania',1),mk('Malteada Milo',2)]}
})();
render();
(function(){
  const h=location.hash;
  if(h==='#cart')openCart();
  else if(h&&h.length>1&&!/^#admin/.test(h)){const go2=()=>{const el=document.getElementById(h.slice(1));if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-64,behavior:'instant'})};go2();window.addEventListener('load',()=>{setTimeout(go2,300);setTimeout(go2,1500)})}
})();
</script>
